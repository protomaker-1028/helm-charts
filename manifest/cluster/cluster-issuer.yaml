apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-traefik
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace this with your actual email address
    email: protomaker@protomakers.io
    privateKeySecretRef:
      name: letsencrypt-traefik-private-key
    solvers:
    - http01:
        ingress:
          class: traefik  # Change to nginx or your specific Ingress Controller
