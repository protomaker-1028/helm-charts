apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-route
  namespace: kafka
spec:
  ingressClassName: traefik
  rules:
    - host: protomakerlab.tail37e3dd.ts.net
      http:
        paths:
          - backend:
              service:
                name: kafka-ui
                port:
                  number: 80
            path: /kafka-ui
            pathType: Prefix
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kafka-bootstrap-route
  namespace: kafka
spec:
  entryPoints:
    - kafka
  routes:
    - match: HostSNI(`*`)
      services:
        - name: kafka-cluster-kafka-external-bootstrap
          port: 9092
