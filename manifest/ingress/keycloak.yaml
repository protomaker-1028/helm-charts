apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-route
  namespace: keycloak
spec:
  ingressClassName: traefik
  rules:
    - host: protomakerlab.tail37e3dd.ts.net
      http:
        paths:
          - backend:
              service:
                name: keycloakx-http
                port:
                  number: 80
            path: /auth
            pathType: Prefix