apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mongodb-ingress-tcp
  namespace: mongodb
spec:
  entryPoints:
    - mongodb # Matches the entrypoint name defined in Traefik
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mongodb-community-svc
          port: 27017