# Strimzi SASL_PLAINTEXT client configuration for kafka-cluster
#
# 1) Set bootstrap.servers to your external bootstrap endpoint on port 9092.
# 2) Replace __APP_CLIENT_PASSWORD__ with the decoded password from secret app-client.

bootstrap.servers=REPLACE_WITH_EXTERNAL_BOOTSTRAP:9092

security.protocol=SASL_PLAINTEXT
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="app-client" password="__APP_CLIENT_PASSWORD__";
