# Strimzi SASL_SSL client configuration for the external kafka-cluster listener.
#
# 1) Download ca.crt from the kafka-cluster-cluster-ca-cert Secret.
# 2) Import it into a truststore, or configure ssl.truststore.location/password below.
# 3) Replace __FORM_SERVICE_PASSWORD__ with the decoded password from the form-service Secret.

bootstrap.servers=kafka-bootstrap.protomakerlab.tail37e3dd.ts.net:9094

security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="form-service" password="__FORM_SERVICE_PASSWORD__";
ssl.truststore.location=/path/to/cluster-ca.p12
ssl.truststore.password=__TRUSTSTORE_PASSWORD__
ssl.truststore.type=PKCS12
